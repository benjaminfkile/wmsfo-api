# docs/api.md section 20: local Postgres with both roles, and a static server for the
# local object store so WMSFO_CDN_BASE_URL can point at http://localhost:9000.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/db-init:/docker-entrypoint-initdb.d:ro
  cdn:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./.local-cdn:/usr/share/nginx/html:ro
      - ./dev/cdn.nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
