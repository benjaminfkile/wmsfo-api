<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{subject}}</title>
    <style>:root { color-scheme: light only; }</style>
  </head>
  <body bgcolor="#eef3fa" style="margin:0;padding:0;background-color:#eef3fa;">
    <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#eef3fa;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef3fa" style="width:100%;background-color:#eef3fa;">
      <tr>
        <td align="center" bgcolor="#eef3fa" style="padding:24px 12px;background-color:#eef3fa;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #d3ddee;border-radius:10px;border-collapse:separate;overflow:hidden;">
            <tr>
              <td bgcolor="#f5f8fd" style="padding:20px 28px;background-color:#f5f8fd;border-bottom:1px solid #d3ddee;border-radius:10px 10px 0 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                  <tr>
                    <td style="padding:0;vertical-align:middle;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td style="padding:0 14px 0 0;vertical-align:middle;">
                            <a href="{{siteUrl}}" style="text-decoration:none;"><img src="{{logoUrl}}" width="64" height="64" alt="{{siteName}}" style="display:block;width:64px;height:64px;border:0;outline:none;text-decoration:none;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:bold;color:#0f1a30;" /></a>
                          </td>
                          <td style="vertical-align:middle;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:19px;line-height:24px;font-weight:bold;color:#0f1a30;">{{siteName}}</td>
                        </tr>
                      </table>
                    </td>
                    <td align="right" style="padding:0 0 0 12px;vertical-align:middle;text-align:right;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">{{statusPill}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td bgcolor="#ffffff" style="padding:28px;padding:clamp(20px, 5vw, 28px);background-color:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:23px;color:#2c3850;">
{{content}}
              </td>
            </tr>
            <tr>
              <td bgcolor="#eef3fa" style="padding:16px 28px;background-color:#eef3fa;border-top:1px solid #d3ddee;border-radius:0 0 10px 10px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:20px;color:#5a6885;">
                <p style="margin:0 0 8px 0;">{{footerReason}}</p>
{{footerLink}}
                <p style="margin:0;"><a href="{{siteUrl}}" style="color:#0b6bb5;text-decoration:underline;">{{siteUrl}}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
