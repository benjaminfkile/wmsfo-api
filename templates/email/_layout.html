<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{subject}}</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light only; }
      @media (prefers-color-scheme: dark) {
        .ground { background-color: #eef3fa !important; }
        .body, .card { background-color: #ffffff !important; }
        .band { background-color: #f5f8fd !important; }
        .foot { background-color: #eef3fa !important; }
        .text { color: #2c3850 !important; }
      }
    </style>
  </head>
  <body class="ground" bgcolor="#eef3fa" style="margin:0;padding:0;background-color:#eef3fa;background-image:linear-gradient(#eef3fa, #eef3fa);">
    <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#eef3fa;">{{preheader}}</div>
    <table class="ground" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef3fa" style="width:100%;background-color:#eef3fa;background-image:linear-gradient(#eef3fa, #eef3fa);">
      <tr>
        <td class="ground" align="center" bgcolor="#eef3fa" style="padding:24px 12px;background-color:#eef3fa;background-image:linear-gradient(#eef3fa, #eef3fa);">
          <table class="ground" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef3fa" style="width:100%;max-width:560px;background-color:#eef3fa;background-image:linear-gradient(#eef3fa, #eef3fa);">
            <tr>
              <td class="ground" align="center" bgcolor="#eef3fa" style="padding:0;font-size:0;line-height:0;background-color:#eef3fa;background-image:linear-gradient(#eef3fa, #eef3fa);"><img src="{{ornamentsUrl}}" width="560" height="110" alt="" style="display:block;width:100%;height:auto;max-width:560px;border:0;outline:none;text-decoration:none;" /></td>
            </tr>
          </table>
          <table class="card" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;background-color:#ffffff;background-image:linear-gradient(#ffffff, #ffffff);border:1px solid #d3ddee;border-radius:16px;border-collapse:separate;overflow:hidden;">
            <tr>
              <td class="band" bgcolor="#f5f8fd" style="padding:20px 28px;background-color:#f5f8fd;background-image:linear-gradient(#f5f8fd, #f5f8fd);border-bottom:1px solid #d3ddee;border-radius:16px 16px 0 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                  <tr>
                    <td style="padding:0;vertical-align:middle;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td style="padding:0 14px 0 0;vertical-align:middle;">
                            <a href="{{siteUrl}}" style="text-decoration:none;"><img src="{{logoUrl}}" width="64" height="64" alt="{{siteName}}" style="display:block;width:64px;height:64px;border:0;outline:none;text-decoration:none;font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:bold;color:#0f1a30;" /></a>
                          </td>
                          <td style="vertical-align:middle;font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:19px;line-height:24px;font-weight:bold;color:#0f1a30 !important;">{{siteName}}</td>
                        </tr>
                      </table>
                    </td>
                    <td align="right" style="padding:0 0 0 12px;vertical-align:middle;text-align:right;font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">{{statusPill}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0;font-size:0;line-height:0;"><img src="{{lightsUrl}}" width="560" height="4" alt="" style="display:block;width:100%;height:auto;max-width:560px;border:0;outline:none;text-decoration:none;" /></td>
            </tr>
            <tr>
              <td class="body text" bgcolor="#ffffff" style="padding:28px;padding:clamp(20px, 5vw, 28px);background-color:#ffffff;background-image:linear-gradient(#ffffff, #ffffff);font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:23px;color:#2c3850 !important;">
{{content}}
              </td>
            </tr>
            <tr>
              <td class="foot" bgcolor="#eef3fa" style="padding:16px 28px;background-color:#eef3fa;background-image:linear-gradient(#eef3fa, #eef3fa);border-top:1px solid #d3ddee;border-radius:0 0 16px 16px;font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:20px;color:#5a6885 !important;">
                <p style="margin:0 0 8px 0;">{{footerReason}}</p>
{{footerLink}}
                <p style="margin:0;"><a href="{{siteUrl}}" style="color:#0b6bb5;text-decoration:underline;">{{siteUrl}}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
