<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#eef3fa;">
    <div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#eef3fa;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#eef3fa;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;background-color:#ffffff;border:1px solid #d3ddee;border-radius:10px;border-collapse:separate;">
            <tr>
              <td style="padding:32px;padding:clamp(20px, 5vw, 32px);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;color:#2c3850;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="padding:0 16px 0 0;vertical-align:middle;">
                      <a href="{{siteUrl}}" style="text-decoration:none;"><img src="{{logoUrl}}" width="96" height="96" alt="Santa Tracker" style="display:block;width:96px;height:96px;border:0;outline:none;text-decoration:none;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:bold;color:#0f1a30;" /></a>
                    </td>
                    <td style="vertical-align:middle;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:22px;line-height:28px;font-weight:bold;color:#0f1a30;">Santa Tracker</td>
                  </tr>
                </table>
{{content}}
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                  <tr>
                    <td style="padding:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;line-height:20px;color:#5a6885;">
                      <p style="margin:0 0 8px 0;">{{footerReason}}</p>
                      <p style="margin:0;"><a href="{{siteUrl}}" style="color:#0b6bb5;text-decoration:underline;">{{siteUrl}}</a></p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
