# docs/api.md section 19 and docs/platform.md section 9.1.
name: deploy

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet tool restore
      - name: Provide a test database connection for the integration tests
        run: echo "WMSFO_TEST_DB_CONNECTION=Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=postgres" >> "$GITHUB_ENV"
      - run: dotnet test --no-build
      # Contract check (api.md section 19 step 2): regenerate contracts/ and fail
      # if anything changed.
      - run: dotnet run --project src/Wmsfo.Api -- export-contracts contracts
      - run: git diff --exit-code contracts/
      # sql.md 14.3: fails the job when the DbContext has drifted from Migrations/.
      - run: dotnet ef migrations has-pending-model-changes --project src/Wmsfo.Api --startup-project src/Wmsfo.Api --context WmsfoDbContext
      # api.md 18 / A17: build the container image so a broken Dockerfile blocks
      # CI. No registry push and no cross-arch here — that lives in the deploy
      # job which is disabled until the ECR repository exists (platform.md 13).
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (verify only)
        run: docker buildx build --load -t wmsfo-api:ci-${{ github.sha }} .

  deploy:
    needs: test
    # Runs for pushes to dev (environment dev, service wmsfo-api-dev). Widen to
    # every push once the prod manifest entry and the prod environment secrets
    # exist (docs/platform.md section 13).
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          TAG="${GITHUB_SHA}-${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          docker buildx build --platform linux/arm64,linux/amd64 \
            -t "${{ secrets.ECR_REPOSITORY }}:${TAG}" --push .
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Deploy through the gateway
        run: |
          TOKEN=$(curl -fsS -X POST "${{ secrets.GATEWAY_TOKEN_URL }}" \
            -u "${{ secrets.GATEWAY_CLIENT_ID }}:${{ secrets.GATEWAY_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials&scope=mgmt/deploy" | jq -r .access_token)
          DEPLOY=$(curl -fsS -X POST "${{ secrets.GATEWAY_BASE_URL }}/mgmt/services/${{ secrets.GATEWAY_SERVICE_NAME }}/deploy" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"tag\":\"${TAG}\"}")
          ID=$(echo "$DEPLOY" | jq -r .deployId)
          for i in $(seq 1 60); do
            STATUS=$(curl -fsS "${{ secrets.GATEWAY_BASE_URL }}/mgmt/deploys/${ID}" -H "Authorization: Bearer ${TOKEN}" | jq -r .status)
            echo "deploy ${ID}: ${STATUS}"
            case "$STATUS" in
              done) exit 0 ;;
              failed|partial) exit 1 ;;
            esac
            sleep 10
          done
          echo "deploy did not finish within 10 minutes"; exit 1
